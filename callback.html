<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization · CheckMate Chess TV</title>
<style>
  :root { --bg:#1a160f; --gold:#c9a227; --cream:#f3ead6; --muted:#b9ac8f; --err:#e06c5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; }
  .wrap { max-width:640px; margin:0 auto; padding:56px 24px; text-align:center; }
  h1 { color:var(--gold); font-size:1.5rem; }
  p { color:var(--muted); }
  .code { margin:28px 0 12px; background:#0f0c08; border:1px solid var(--gold);
    border-radius:10px; padding:20px; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:1rem; color:var(--cream); word-break:break-all; }
  button { background:var(--gold); color:#1a160f; border:0; border-radius:8px;
    padding:12px 22px; font-size:1rem; font-weight:600; cursor:pointer; }
  button:active { transform:translateY(1px); }
  .ok { color:var(--gold); min-height:1.4em; margin-top:14px; font-weight:600; }
  .err { color:var(--err); }
  .hint { font-size:.85rem; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CheckMate Chess TV — Authorization</h1>
  <div id="body">
    <p>Reading your authorization code…</p>
  </div>
</div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    var body = document.getElementById('body');

    if (error) {
      body.innerHTML = '<p class="err">Authorization failed: ' +
        (params.get('error_description') || error) + '</p>' +
        '<p>Close this tab and run the script again.</p>';
      return;
    }
    if (!code) {
      body.innerHTML = '<p class="err">No authorization code found in the URL.</p>';
      return;
    }

    body.innerHTML =
      '<p>Copy this code and paste it back into the script:</p>' +
      '<div class="code" id="code">' + code + '</div>' +
      '<button id="copy">Copy code</button>' +
      '<div class="ok" id="ok"></div>' +
      '<p class="hint">You can close this tab after copying.</p>';

    document.getElementById('copy').addEventListener('click', function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById('ok').textContent = 'Copied ✓';
      }, function () {
        document.getElementById('ok').textContent =
          'Copy failed — select the code above manually.';
      });
    });
  })();
</script>
</body>
</html>
