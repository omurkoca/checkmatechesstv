<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get CheckMate Chess</title>
<meta name="description" content="CheckMate Chess - mate-in-N puzzles from real games. Free on iOS and Android.">
<style>
  :root { --bg:#1a160f; --gold:#c9a227; --cream:#f3ead6; --muted:#b9ac8f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 20px; }
  .wrap { max-width:420px; width:100%; text-align:center; }
  img.logo { width:132px; height:132px; border-radius:50%; }
  h1 { color:var(--gold); font-size:1.7rem; margin:18px 0 2px; }
  .tag { color:var(--muted); font-style:italic; margin:0 0 28px; }
  a.store { display:block; margin:12px 0; padding:15px 20px; border-radius:10px;
    background:var(--gold); color:#1a160f; font-weight:700; font-size:1.05rem;
    text-decoration:none; }
  a.store.alt { background:transparent; color:var(--gold);
    border:2px solid var(--gold); }
  .note { color:var(--muted); font-size:.85rem; margin-top:26px; }
  .note a { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="icon.png" alt="CheckMate Chess">
  <h1>CheckMate Chess</h1>
  <p class="tag">Every move tells a story.</p>

  <a class="store" id="ios" href="https://apps.apple.com/us/app/checkmate-chess-mate-puzzles/id6804023104">Download on the App Store</a>
  <a class="store alt" id="android" href="https://play.google.com/store/apps/details?id=tv.checkmatechess.checkmate_chess">Get it on Google Play</a>

  <p class="note">Mate-in-N puzzles from real games.<br>
    <a href="index.html">CheckMate Chess TV</a></p>
</div>

<script>
  // Telefonda dogrudan dogru magazaya gonder; masaustunde ve JS kapaliysa
  // iki dugme de zaten gorunuyor, sayfa o haliyle calisir.
  var ua = navigator.userAgent || "";
  var hedef = null;
  if (/iPhone|iPad|iPod/i.test(ua)) {
    hedef = document.getElementById("ios").href;
  } else if (/Android/i.test(ua)) {
    hedef = document.getElementById("android").href;
  }
  if (hedef) { location.replace(hedef); }
</script>
</body>
</html>
